name: Prototype checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements-lock.txt -e './backend[test]' -e ./detection
      - run: python -m pytest
        working-directory: backend
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: web
      - run: cp .env.example .env && docker compose config --quiet
  postgis:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-lock.txt -e './backend[test]' -e ./detection
      - run: cp .env.example .env && docker compose up -d --build --wait db
      - run: python -m pytest tests/test_postgis.py tests/test_workflows.py
        working-directory: backend
        env:
          TEST_POSTGIS_URL: postgresql+psycopg://terraguavd:replace-with-a-random-local-password@127.0.0.1:5432/terraguavd
      - if: always()
        run: docker compose down
